# Standalone HTTP-context include; do not merge into existing project sites.
limit_req_zone $binary_remote_addr zone=moonveil_games_api:1m rate=30r/s;
server {
    listen 8081 ssl;
    server_name 123.57.60.66;
    ssl_certificate /etc/games/tls/server.crt;
    ssl_certificate_key /etc/games/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    auth_basic "Moonveil games";
    auth_basic_user_file /etc/games/htpasswd;
    client_max_body_size 8k;
    access_log /var/log/nginx/moonveil-games-access.log;
    error_log /var/log/nginx/moonveil-games-error.log;
    location /api/ {
        limit_req zone=moonveil_games_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3201;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
    }
    location / {
        proxy_pass http://127.0.0.1:3201;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
    }
}
